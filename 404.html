<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Chang Sheng 昌盛酒家</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0806">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0806;
  --cream:#F2EBDA;
  --cream-soft:rgba(242,235,218,.75);
  --gold:#D4A843;
  --accent:#C8102E;
  --border:rgba(242,235,218,.14);
}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--cream);
  display:flex;align-items:center;justify-content:center;
  text-align:center;
  padding:24px;
}
.error-page{max-width:520px}
.error-page__brand{
  display:block;
  font-family:'Crimson Pro',Georgia,serif;
  font-weight:700;
  font-size:1.1rem;
  letter-spacing:.04em;
  color:var(--gold);
  margin-bottom:28px;
}
.error-page__mark{
  width:52px;height:52px;
  margin:0 auto 28px;
  border:1.5px solid var(--gold);
  transform:rotate(45deg);
  position:relative;
}
.error-page__mark::before{
  content:'';
  position:absolute;inset:10px;
  border:1px solid var(--accent);
}
.error-page__code{
  font-family:'Crimson Pro',Georgia,serif;
  font-size:clamp(3.5rem,12vw,5.5rem);
  font-weight:800;
  color:var(--cream);
  line-height:1;
  margin-bottom:16px;
}
.error-page__title{
  font-family:'Crimson Pro',Georgia,serif;
  font-size:clamp(1.3rem,3vw,1.8rem);
  font-weight:700;
  margin-bottom:14px;
}
.error-page__text{
  color:var(--cream-soft);
  font-size:.95rem;
  line-height:1.7;
  margin-bottom:32px;
}
.error-page__actions{
  display:flex;flex-wrap:wrap;gap:12px;justify-content:center;
}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 28px;
  border-radius:100px;
  font-size:.88rem;font-weight:600;
  text-decoration:none;
  transition:all .25s;
  border:1px solid transparent;
}
.btn--primary{background:var(--gold);color:var(--bg)}
.btn--primary:hover{background:#e8c972;transform:translateY(-2px)}
.btn--outline{border-color:var(--border);color:var(--cream)}
.btn--outline:hover{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>
<div class="error-page">
  <span class="error-page__brand">昌盛酒家 · Chang Sheng</span>
  <div class="error-page__mark" aria-hidden="true"></div>
  <div class="error-page__code">404</div>
  <h1 class="error-page__title">Esta página no está en nuestra carta</h1>
  <p class="error-page__text">Parece que el contenido que buscas cambió de ubicación o ya no se encuentra disponible.</p>
  <div class="error-page__actions">
    <a class="btn btn--primary" href="/chang-sheng/">Volver al inicio</a>
    <a class="btn btn--outline" href="/chang-sheng/#carta">Ver la carta</a>
    <a class="btn btn--outline" href="https://wa.me/56954663415" target="_blank" rel="noreferrer">Escribir por WhatsApp</a>
  </div>
</div>
</body>
</html>
